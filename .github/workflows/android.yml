name: Android-App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Android-Projekt erzeugen
        run: npx cap add android

      - name: Icons und Startbild erzeugen
        run: npx capacitor-assets generate --android --iconBackgroundColor '#07090c' --iconBackgroundColorDark '#07090c' --splashBackgroundColor '#07090c' --splashBackgroundColorDark '#07090c'

      - name: Versionsnummer setzen
        run: |
          VER=$(node -p "require('./package.json').version")
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VER\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Web-Dateien übernehmen
        run: npx cap sync android

      # Ohne eigenen Schlüssel: Test-APK (zum Ausprobieren)
      - name: Test-APK bauen
        if: env.HAS_KEY != 'true'
        run: |
          cd android && ./gradlew assembleDebug
          mkdir -p ../out && cp app/build/outputs/apk/debug/app-debug.apk ../out/DieBox-test.apk

      # Mit eigenem Schlüssel: signierte APK (für Verteilung) + AAB (für den Play Store)
      - name: Signierte APK und AAB bauen
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # keystore.enc ist der mit AES-256 verschlüsselte Signaturschlüssel; nur mit dem Secret entschlüsselbar
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in keystore.enc -out "$RUNNER_TEMP/release.jks" -pass env:KEYSTORE_PASSWORD
          mkdir -p out
          # apksigner (Android build-tools) liefert v2/v3-Signaturen – Pflicht ab Android 11
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          export PATH="$BT:$PATH"
          which apksigner
          npx cap build android --signing-type apksigner --keystorepath "$RUNNER_TEMP/release.jks" --keystorepass "$KEYSTORE_PASSWORD" --keystorealias diebox --keystorealiaspass "$KEYSTORE_PASSWORD" --androidreleasetype APK
          cp android/app/build/outputs/apk/release/*-signed.apk out/DieBox.apk
          apksigner verify --verbose --min-sdk-version 24 out/DieBox.apk | head -6
          npx cap build android --keystorepath "$RUNNER_TEMP/release.jks" --keystorepass "$KEYSTORE_PASSWORD" --keystorealias diebox --keystorealiaspass "$KEYSTORE_PASSWORD" --androidreleasetype AAB
          cp android/app/build/outputs/bundle/release/*-signed.aab out/DieBox-PlayStore.aab
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Ergebnis hochladen
        uses: actions/upload-artifact@v4
        with:
          name: DieBox-Android
          path: out/*

      - name: Version lesen
        id: ver
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Veröffentlicht die APK als Download unter github.com/<Nutzer>/die-box/releases/latest
      - name: Als Release veröffentlichen
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Die Box ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Installation:** `DieBox*.apk` herunterladen → öffnen → „Installation aus unbekannten Quellen“ erlauben.
            Build ${{ github.run_number }}
          files: out/*.apk
